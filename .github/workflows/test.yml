name: Test

on:
  push:
    branches: ['**']
  pull_request:
  # Weekly run on main that also covers the minimum supported Unity version.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      all_versions:
        description: Also test the minimum supported Unity version
        type: boolean
        default: true
  # Called by the release workflow to test the release branch with the freshly built plugins.
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to test
        type: string
        required: true
      all_versions:
        description: Also test the minimum supported Unity version
        type: boolean
        default: true

concurrency:
  # A fixed name, because inside a called workflow github.workflow is the caller's name.
  # Include the event and the tested ref so pushes, scheduled runs and releases do not cancel each other.
  group: test-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  package-check:
    name: Package check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Validate package.json
        run: python3 -c "import json; m = json.load(open('package.json')); assert m['name'] == 'com.fdgs.webrtc', m['name']; print(m['name'], m['version'])"

      - name: Check that every asset has a .meta file
        run: |
          missing=0
          while IFS= read -r -d '' path; do
            if [ ! -f "$path.meta" ]; then
              echo "::error file=$path::Missing $path.meta"
              missing=1
            fi
          # Files inside .framework/.bundle folders are part of one asset and have no .meta of their own.
          done < <(find Runtime Editor Tests -mindepth 1 \( -path '*.framework/*' -o -path '*.bundle/*' \) -prune -o ! -name '*.meta' -print0)
          exit $missing

  unity-tests:
    name: Unity ${{ matrix.unityVersion }} (${{ matrix.testMode }})
    needs: package-check
    runs-on: ubuntu-24.04
    # Unity license secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests test only the current LTS. The weekly schedule, releases and
        # manual runs (by default) also test the minimum supported version from package.json.
        # A release calls this workflow from a workflow_dispatch run, so its all_versions input applies.
        unityVersion: ${{ fromJSON((github.event_name == 'schedule' || inputs.all_versions) && '["6000.0.84f1", "6000.3.26f1"]' || '["6000.3.26f1"]') }}
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # game-ci always uses the Unity version from ProjectVersion.txt for a full project,
      # so write the matrix version there before restoring the cache and running tests.
      - name: Select Unity ${{ matrix.unityVersion }}
        run: |
          echo "m_EditorVersion: ${{ matrix.unityVersion }}" > WebRTC~/ProjectSettings/ProjectVersion.txt

      - uses: actions/cache@v6
        with:
          path: WebRTC~/Library
          key: Library-${{ matrix.unityVersion }}-${{ matrix.testMode }}-${{ hashFiles('WebRTC~/Packages/manifest.json', 'WebRTC~/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.unityVersion }}-${{ matrix.testMode }}-

      # Activates Unity with the repository secrets UNITY_EMAIL and UNITY_PASSWORD.
      # A UNITY_LICENSE file is not passed: it is bound to the machine it was created on, so the
      # action fell back to the account on every run anyway. See https://game.ci/docs/github/activation
      - uses: game-ci/unity-test-runner@v4.4.0
        id: tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Lets the action query GitHub's API with the job token instead of the shared, rate-limited runner IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          cliVersion: v0.1.72
          projectPath: WebRTC~
          unityVersion: ${{ matrix.unityVersion }}
          testMode: ${{ matrix.testMode }}
          # The runners have no GPU. Without -nographics Unity falls back to Mesa's llvmpipe,
          # where the native plugin aborts when it creates a GLX context on a worker thread.
          # Tests that need a graphics device are ignored when there is none.
          customParameters: -nographics
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.unityVersion }} ${{ matrix.testMode }} results

      - uses: actions/upload-artifact@v7
        if: always() && steps.tests.outputs.artifactsPath != ''
        with:
          name: test-results-${{ matrix.unityVersion }}-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
